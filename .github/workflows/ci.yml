name: CI

# Runs on every pull request targeting main and on direct pushes to main.
# All jobs in this workflow are required status checks: a PR cannot be
# merged unless every job passes.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  commit-lint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore LecturIA.sln

      - name: Materialize UID key from secret
        shell: pwsh
        env:
          UID_KEY_B64: ${{ secrets.UID_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UID_KEY_B64)) {
              throw "UID_KEY_B64 secret is not set. See docs/security/encryption.md."
          }
          Set-Content -Path "src/LecturIA.App/Assets/uid-key.txt" -Value $env:UID_KEY_B64 -NoNewline

      - name: Build
        run: dotnet build LecturIA.sln -c Release --no-restore --nologo
